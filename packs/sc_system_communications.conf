{
  "platform": "windows",
  "version": "1.0.0",
  "queries": {
    "sc_firewall_enabled": {
      "query": "SELECT type, name, state, signatures_up_to_date FROM windows_security_products WHERE type = 'Firewall';",
      "interval": 1800,
      "version": "1.0.0",
      "description": "Verify Windows Firewall is enabled and active",
      "value": "Maps to NIST 800-171 control 3.13.1 - Monitor and protect communications. Firewall provides boundary protection for network communications.",
      "snapshot": false
    },
    "sc_open_ports": {
      "query": "SELECT DISTINCT lp.port, lp.protocol, lp.address, lp.pid, p.name, p.path FROM listening_ports lp LEFT JOIN processes p ON lp.pid = p.pid WHERE lp.port NOT IN (135, 139, 445) ORDER BY lp.port;",
      "interval": 1800,
      "version": "1.0.0",
      "description": "Identify all listening network ports and associated processes",
      "value": "Maps to NIST 800-171 control 3.13.1 - Unnecessary open ports expand attack surface; monitoring detects unauthorized services.",
      "snapshot": false
    },
    "sc_ssl_certificates": {
      "query": "SELECT common_name, issuer, self_signed, not_valid_before, not_valid_after, signing_algorithm, key_algorithm, key_strength, sha1, path FROM certificates WHERE path LIKE 'C:\\\\%';",
      "interval": 86400,
      "version": "1.0.0",
      "description": "Enumerate installed SSL/TLS certificates for encrypted communications",
      "value": "Maps to NIST 800-171 control 3.13.8 - Implement cryptographic mechanisms to prevent unauthorized disclosure during transmission.",
      "snapshot": false
    }
  }
}
