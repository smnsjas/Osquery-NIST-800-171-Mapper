{
  "platform": "windows",
  "version": "1.0.0",
  "queries": {
    "au_audit_policy_settings": {
      "query": "SELECT name, type, data FROM registry WHERE key LIKE 'HKEY_LOCAL_MACHINE\\\\Security\\\\Policy\\\\PolAdtEv\\\\%';",
      "interval": 7200,
      "version": "1.0.0",
      "description": "Check Windows audit policy configuration via registry",
      "value": "Maps to NIST 800-171 control 3.3.1 - Create and retain system audit logs. Audit logging must be enabled to detect and investigate security incidents.",
      "snapshot": false
    },
    "au_process_auditing": {
      "query": "SELECT p.pid, p.name, p.path, p.cmdline, p.uid, u.username, p.parent, p.start_time FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE p.start_time > (strftime('%s','now') - 86400);",
      "interval": 3600,
      "version": "1.0.0",
      "description": "Track process execution with user attribution for accountability",
      "value": "Maps to NIST 800-171 control 3.3.2 - Ensure actions of individual users can be uniquely traced. Correlates processes to user accounts for accountability.",
      "snapshot": false
    }
  }
}
