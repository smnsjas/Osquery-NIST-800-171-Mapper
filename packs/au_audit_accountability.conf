{
  "platform": "windows",
  "version": "1.0.0",
  "queries": {
    "au_audit_policy_settings": {
      "query": "SELECT name, type, data FROM registry WHERE key LIKE 'HKEY_LOCAL_MACHINE\\\\Security\\\\Policy\\\\PolAdtEv\\\\%';",
      "interval": 7200,
      "version": "1.0.0",
      "description": "Check Windows audit policy configuration via registry",
      "value": "Maps to NIST 800-171 control 3.3.1 - Create and retain system audit logs. Audit logging must be enabled to detect and investigate security incidents.",
      "snapshot": true
    }
  }
}
