{
  "platform": "windows",
  "version": "1.0.0",
  "queries": {
    "ac_local_users": {
      "query": "SELECT uid, username, description, type, shell FROM users WHERE uid >= 1000 AND username NOT IN ('Guest', 'DefaultAccount', 'WDAGUtilityAccount');",
      "interval": 3600,
      "version": "1.0.0",
      "description": "Enumerate all local user accounts (excluding built-in system accounts)",
      "value": "Maps to NIST 800-171 control 3.1.1 - Limit system access to authorized users. Identifies unauthorized or unexpected local accounts.",
      "snapshot": false
    },
    "ac_admin_users": {
      "query": "SELECT u.username, u.uid, g.groupname FROM users u JOIN user_groups ug ON u.uid = ug.uid JOIN groups g ON ug.gid = g.gid WHERE g.groupname = 'Administrators';",
      "interval": 1800,
      "version": "1.0.0",
      "description": "List all members of the local Administrators group",
      "value": "Maps to NIST 800-171 control 3.1.1 - Administrative accounts have elevated privileges and should be strictly controlled.",
      "snapshot": false
    },
    "ac_active_sessions": {
      "query": "SELECT user, host, time, type FROM logged_in_users WHERE type NOT IN ('system', 'boot');",
      "interval": 900,
      "version": "1.0.0",
      "description": "Monitor currently logged-in users and active sessions",
      "value": "Maps to NIST 800-171 control 3.1.1 - Detects unauthorized active access to the system.",
      "snapshot": false
    },
    "ac_privileged_groups": {
      "query": "SELECT u.username, g.groupname, u.uid FROM users u JOIN user_groups ug ON u.uid = ug.uid JOIN groups g ON ug.gid = g.gid WHERE g.groupname IN ('Administrators', 'Power Users', 'Remote Desktop Users', 'Backup Operators', 'Server Operators');",
      "interval": 3600,
      "version": "1.0.0",
      "description": "Identify users in privileged groups",
      "value": "Maps to NIST 800-171 control 3.1.5 - Employ the principle of least privilege. Privileged group membership should be minimal.",
      "snapshot": false
    },
    "ac_uac_settings": {
      "query": "SELECT key, name, type, data FROM registry WHERE path = 'HKEY_LOCAL_MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\System\\\\EnableLUA';",
      "interval": 7200,
      "version": "1.0.0",
      "description": "Check User Account Control (UAC) registry settings",
      "value": "Maps to NIST 800-171 control 3.1.5 - UAC enforces least privilege by requiring elevation for administrative tasks.",
      "snapshot": false
    },
    "ac_lockout_policy_file": {
      "query": "SELECT JSON_EXTRACT(data, '$.account_lockout.lockout_threshold') AS lockout_threshold, JSON_EXTRACT(data, '$.account_lockout.lockout_duration') AS lockout_duration, JSON_EXTRACT(data, '$.account_lockout.lockout_window') AS lockout_window, JSON_EXTRACT(data, '$.compliance.nist_3_1_8_lockout_configured') AS compliant, JSON_EXTRACT(data, '$.metadata.timestamp') AS last_check FROM (SELECT file.data AS data FROM file WHERE path = 'C:\\\\ProgramData\\\\osquery\\\\security_policy.json');",
      "interval": 3600,
      "version": "1.0.0",
      "description": "Account lockout policy from exported security policy file",
      "value": "Maps to NIST 800-171 control 3.1.8 - Limit unsuccessful logon attempts. Reads policy data exported by scheduled task.",
      "snapshot": false
    },
    "ac_listening_ports": {
      "query": "SELECT DISTINCT protocol, port, address, pid, path FROM listening_ports WHERE port NOT IN (135, 445) AND address NOT IN ('127.0.0.1', '::1');",
      "interval": 1800,
      "version": "1.0.0",
      "description": "Enumerate network services listening on non-standard ports",
      "value": "Maps to NIST 800-171 control 3.1.2 - Limit system access to transaction types. Identifies potentially unauthorized services.",
      "snapshot": false
    },
    "ac_privileged_processes": {
      "query": "SELECT p.name, p.path, p.cmdline, p.uid, u.username FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE p.path LIKE '%System32%' OR p.path LIKE '%SysWOW64%';",
      "interval": 3600,
      "version": "1.0.0",
      "description": "Monitor processes running from system directories",
      "value": "Maps to NIST 800-171 control 3.1.6 and 3.1.7 - Non-privileged account usage and prevent privileged execution. Identifies processes that should run with least privilege.",
      "snapshot": false
    },
    "ac_network_shares": {
      "query": "SELECT name, path, type, permissions, max_connections FROM shares WHERE name NOT IN ('IPC$', 'ADMIN$') AND NOT name LIKE '%$';",
      "interval": 3600,
      "version": "1.0.0",
      "description": "Enumerate active network shares",
      "value": "Maps to NIST 800-171 control 3.1.3 - Control flow of CUI. Identifies file shares that may contain sensitive data.",
      "snapshot": false
    },
    "ac_session_lock": {
      "query": "SELECT key, name, data FROM registry WHERE (path = 'HKEY_LOCAL_MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\System\\\\InactivityTimeoutSecs' OR path LIKE 'HKEY_USERS\\\\%\\\\Control Panel\\\\Desktop\\\\ScreenSaveTimeOut');",
      "interval": 7200,
      "version": "1.0.0",
      "description": "Check screen saver and session lock timeout settings",
      "value": "Maps to NIST 800-171 control 3.1.10 and 3.1.11 - Session lock and inactivity timeout. Ensures workstations lock after inactivity.",
      "snapshot": false
    },
    "ac_remote_sessions": {
      "query": "SELECT user, tty, host, time, type FROM logged_in_users WHERE host != 'localhost' AND host != '' AND host NOT LIKE '127.%' AND host != '::1';",
      "interval": 600,
      "version": "1.0.0",
      "description": "Monitor remote login sessions",
      "value": "Maps to NIST 800-171 control 3.1.12 and 3.1.20 - Monitor and control remote access sessions.",
      "snapshot": false
    },
    "ac_rdp_settings": {
      "query": "SELECT name, type, data FROM registry WHERE path = 'HKEY_LOCAL_MACHINE\\\\SYSTEM\\\\CurrentControlSet\\\\Control\\\\Terminal Server\\\\fDenyTSConnections' OR path = 'HKEY_LOCAL_MACHINE\\\\SYSTEM\\\\CurrentControlSet\\\\Control\\\\Terminal Server\\\\WinStations\\\\RDP-Tcp\\\\SecurityLayer';",
      "interval": 7200,
      "version": "1.0.0",
      "description": "Check Remote Desktop Protocol security settings",
      "value": "Maps to NIST 800-171 control 3.1.13 and 3.1.20 - Employ cryptographic mechanisms for remote access and control remote sessions.",
      "snapshot": false
    }
  }
}
