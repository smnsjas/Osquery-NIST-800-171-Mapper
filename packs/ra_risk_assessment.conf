{
  "platform": "windows",
  "version": "1.0.0",
  "queries": {
    "ra_vulnerability_scanning": {
      "query": "SELECT hotfix_id, description, installed_on FROM patches WHERE installed_on > date('now', '-30 days') ORDER BY installed_on DESC;",
      "interval": 86400,
      "version": "1.0.0",
      "description": "Track recent security patches as evidence of vulnerability remediation",
      "value": "Maps to NIST 800-171 control 3.11.2 - Scan for vulnerabilities periodically. Recent patch installation indicates active vulnerability management.",
      "snapshot": false
    }
  }
}
