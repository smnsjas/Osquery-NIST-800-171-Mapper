{
  "platform": "windows",
  "version": "1.0.0",
  "queries": {
    "cm_installed_programs": {
      "query": "SELECT name, version, install_location, install_date, publisher FROM programs ORDER BY name;",
      "interval": 7200,
      "version": "1.0.0",
      "description": "Inventory all installed software via Windows Installer",
      "value": "Maps to NIST 800-171 control 3.4.1 - Establish and maintain baseline configurations and inventories. Software inventory is foundational for configuration management.",
      "snapshot": true
    },
    "cm_system_baseline": {
      "query": "SELECT hostname, uuid, cpu_brand, cpu_physical_cores, physical_memory, hardware_vendor, hardware_model FROM system_info;",
      "interval": 86400,
      "version": "1.0.0",
      "description": "Collect system hardware and OS configuration",
      "value": "Maps to NIST 800-171 control 3.4.1 - Hardware and OS inventory establishes system baseline for asset management.",
      "snapshot": true
    },
    "cm_security_settings": {
      "query": "SELECT name, type, data FROM registry WHERE path = 'HKEY_LOCAL_MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\System\\\\EnableLUA' OR path = 'HKEY_LOCAL_MACHINE\\\\SYSTEM\\\\CurrentControlSet\\\\Control\\\\Lsa\\\\RestrictAnonymous' OR path = 'HKEY_LOCAL_MACHINE\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\\LanmanServer\\\\Parameters\\\\AutoShareWks';",
      "interval": 7200,
      "version": "1.0.0",
      "description": "Monitor critical Windows security configuration settings",
      "value": "Maps to NIST 800-171 control 3.4.2 - Establish and enforce security configuration settings (UAC, anonymous access, auto shares).",
      "snapshot": false
    },
    "cm_running_services": {
      "query": "SELECT s.name, s.display_name, s.status, s.start_type, s.path, s.user_account FROM services s WHERE s.status = 'RUNNING' AND s.start_type IN ('AUTO_START', 'DEMAND_START');",
      "interval": 3600,
      "version": "1.0.0",
      "description": "Enumerate running Windows services",
      "value": "Maps to NIST 800-171 control 3.4.6 - Employ least functionality by identifying unnecessary services that should be disabled.",
      "snapshot": false
    },
    "cm_startup_items": {
      "query": "SELECT name, path, source, status, username FROM startup_items WHERE status = 'enabled';",
      "interval": 7200,
      "version": "1.0.0",
      "description": "Monitor programs configured to start automatically",
      "value": "Maps to NIST 800-171 control 3.4.7 - Restrict and prevent use of nonessential programs by tracking startup items.",
      "snapshot": false
    },
    "cm_installed_software_changes": {
      "query": "SELECT name, version, install_date, publisher FROM programs WHERE install_date > date('now', '-7 days') ORDER BY install_date DESC;",
      "interval": 86400,
      "version": "1.0.0",
      "description": "Detect recently installed software (last 7 days)",
      "value": "Maps to NIST 800-171 control 3.4.9 - Control and monitor user-installed software to prevent unauthorized applications.",
      "snapshot": false
    }
  }
}
