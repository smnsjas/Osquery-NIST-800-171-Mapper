{
  "platform": "windows",
  "version": "1.0.0",
  "queries": {
    "ia_password_policy_file": {
      "query": "SELECT JSON_EXTRACT(data, '$.password_policy.min_password_length') AS min_length, JSON_EXTRACT(data, '$.password_policy.password_complexity') AS complexity_enabled, JSON_EXTRACT(data, '$.password_policy.min_password_age') AS min_age, JSON_EXTRACT(data, '$.password_policy.max_password_age') AS max_age, JSON_EXTRACT(data, '$.password_policy.password_history') AS history_count, JSON_EXTRACT(data, '$.compliance.nist_3_5_7_password_length_ok') AS length_ok, JSON_EXTRACT(data, '$.compliance.nist_3_5_7_complexity_enabled') AS complexity_ok, JSON_EXTRACT(data, '$.metadata.timestamp') AS last_check FROM (SELECT file.data AS data FROM file WHERE path = 'C:\\\\ProgramData\\\\osquery\\\\security_policy.json');",
      "interval": 3600,
      "version": "1.0.0",
      "description": "Password complexity policy from exported security policy file",
      "value": "Maps to NIST 800-171 control 3.5.7 - Enforce minimum password complexity. Reads policy data exported by scheduled task.",
      "snapshot": false
    }
  }
}
