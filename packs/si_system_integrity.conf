{
  "platform": "windows",
  "version": "1.0.0",
  "queries": {
    "si_windows_patches": {
      "query": "SELECT hotfix_id, description, installed_by, installed_on FROM patches ORDER BY installed_on DESC LIMIT 50;",
      "interval": 7200,
      "version": "1.0.0",
      "description": "List all installed Windows patches and hotfixes",
      "value": "Maps to NIST 800-171 control 3.14.1 - Identify and correct system flaws timely. Patch management is critical for vulnerability remediation.",
      "snapshot": true
    },
    "si_update_service_status": {
      "query": "SELECT name, display_name, status, start_type FROM services WHERE name = 'wuauserv';",
      "interval": 3600,
      "version": "1.0.0",
      "description": "Check Windows Update service status",
      "value": "Maps to NIST 800-171 control 3.14.1 - Windows Update must be running to receive security patches.",
      "snapshot": true
    },
    "si_antivirus_enabled": {
      "query": "SELECT type, name, state, signatures_up_to_date FROM windows_security_products WHERE type IN ('Antivirus', 'Antispyware');",
      "interval": 1800,
      "version": "1.0.0",
      "description": "Check antivirus/antimalware status and signature freshness",
      "value": "Maps to NIST 800-171 control 3.14.2 - Provide protection from malicious code. Malware protection is essential defense.",
      "snapshot": true
    },
    "si_defender_running": {
      "query": "SELECT name, display_name, status, start_type, path FROM services WHERE name IN ('WinDefend', 'WdNisSvc', 'Sense');",
      "interval": 1800,
      "version": "1.0.0",
      "description": "Verify Windows Defender service is running",
      "value": "Maps to NIST 800-171 control 3.14.2 - Windows Defender service must be active to provide real-time protection.",
      "snapshot": true
    },
    "si_active_connections": {
      "query": "SELECT pos.pid, p.name, pos.protocol, pos.local_address, pos.local_port, pos.remote_address, pos.remote_port, pos.state FROM process_open_sockets pos LEFT JOIN processes p ON pos.pid = p.pid WHERE pos.state = 'ESTABLISHED' AND pos.remote_address NOT LIKE '127.%' AND pos.remote_address NOT LIKE '::1';",
      "interval": 900,
      "version": "1.0.0",
      "description": "Monitor active network connections and associated processes",
      "value": "Maps to NIST 800-171 control 3.14.6 - Monitor systems to detect attacks. Unexpected network connections may indicate compromise.",
      "snapshot": true
    },
    "si_remote_access": {
      "query": "SELECT user, host, time, type, sid FROM logged_in_users WHERE host IS NOT NULL AND host != 'localhost' AND host != '127.0.0.1';",
      "interval": 900,
      "version": "1.0.0",
      "description": "Detect remote login sessions",
      "value": "Maps to NIST 800-171 control 3.14.6 - Remote sessions should be monitored for unauthorized access.",
      "snapshot": true
    }
  }
}
